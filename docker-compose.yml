services:

  api:
    build: .
    container_name: ai_gateway_6_of_10_api
    env_file: .env
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      REDIS_HOST: ${REDIS_HOST}
    ports:
      - "${DAY6_API_PORT:-4408}:8080"
    networks:
      - ai-gateway-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build: .
    container_name: ai_gateway_6_of_10_worker
    command: ["node", "src/queue/worker.js"]
    env_file: .env
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      REDIS_HOST: ${REDIS_HOST}
      WORKER_METRICS_PORT: "8080"
    networks:
      - ai-gateway-net

volumes:
  day6_postgres_data:
  day6_prometheus_data:
  day6_grafana_data:

networks:
  ai-gateway-net:
    external: true
  databases:
    external: true